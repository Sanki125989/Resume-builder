spring.datasource.url=jdbc:mysql://localhost:3306/resume_builder?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect

# Server port
server.port=8085

# JWT configuration
jwt.secret=your_jwt_secret
jwt.expiration=3600

# Logging configuration
logging.level.org.springframework=INFO
logging.level.com.resumebuilder=DEBUG

# DevTools configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.poll-interval=2000
spring.devtools.restart.quiet-period=1000

# Java Module System - Allow native access for Tomcat
# Add to VM options in IDE: --enable-native-access=ALL-UNNAMED

